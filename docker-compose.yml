version: '3.8'

services:

  mongo:
    image: mongo:6.0
    container_name: mongo_sucursales
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  sucursales-api:
    build: .
    container_name: sucursales_api
    ports:
      - "8081:8080"
    depends_on:
      - mongo
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/banquito_sucursales


volumes:
  mongo_data:
